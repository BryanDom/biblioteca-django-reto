{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block titulo %}Biblioteca{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'lista_prestamo' %}">
        <i class="bi bi-book-half me-2"></i>Biblioteca
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'lista_prestamo' %}">
              <i class="bi bi-journal-bookmark me-1"></i>Préstamos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin/">
              <i class="bi bi-shield-lock me-1"></i>Admin
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/api/docs/">
              <i class="bi bi-code-slash me-1"></i>API Docs
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">

    {% if messages %}
    {% for mensaje in messages %}
    <div
      class="alert {% if mensaje.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show"
      role="alert">
      <i class="bi {% if mensaje.tags == 'error' %}bi-x-circle{% else %}bi-check-circle{% endif %} me-2"></i>
      {{ mensaje }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    {% block contenido %}{% endblock %}

  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
